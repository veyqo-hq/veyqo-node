# Publishes to npm when a GitHub release is created, through npm trusted
# publishing (OIDC): no token is stored anywhere. npmjs.com → @veyqo/node →
# Settings → Trusted Publisher names this repository and this workflow file.
name: Publish
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm test
      # Provenance is attached automatically with trusted publishing.
      - run: npm publish --access public
